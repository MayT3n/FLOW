name: Android APK

on:
  push:
    branches: [main, master, matfocus-1.2]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'نسخه‌ی دلخواه (مثلاً 1.2.0). خالی = از version.txt'
        required: false
        default: ''

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write   # فقط برای انتشار در GitHub Releases هنگام Tag

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Android SDK روی ران‌ر از قبل نصب است؛ فقط لایسنس‌ها را می‌پذیریم (AGP بقیه را خودکار می‌گیرد)
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      # Cache وابستگی‌ها و Gradle
      - uses: gradle/actions/setup-gradle@v4

      - name: Resolve version
        id: ver
        env:
          INPUT_VERSION: ${{ inputs.version_name }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            NAME="${GITHUB_REF_NAME#v}"
          elif [[ -n "${INPUT_VERSION:-}" ]]; then
            NAME="$INPUT_VERSION"
          else
            NAME="$(tr -d '[:space:]' < version.txt)"
          fi
          if ! [[ "$NAME" =~ ^[0-9]+(\.[0-9]+){1,3}([-+][0-9A-Za-z.]+)?$ ]]; then
            echo "::error::نام نسخه معتبر نیست: $NAME"; exit 1
          fi
          CODE=$((1000 + GITHUB_RUN_NUMBER))
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Version: $NAME ($CODE)"

      # فونت وزیرمتن (مجوز OFL). اگر دریافت نشود برنامه با فونت سیستم ساخته می‌شود.
      - name: Download Vazirmatn font
        continue-on-error: true
        run: |
          mkdir -p app/src/main/assets/fonts
          base="https://raw.githubusercontent.com/rastikerdar/vazirmatn/master/fonts/ttf"
          for w in Regular Medium Bold; do
            curl -fsSL --retry 3 -o "app/src/main/assets/fonts/Vazirmatn-$w.ttf" "$base/Vazirmatn-$w.ttf"
          done
          ls -l app/src/main/assets/fonts

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Prepare signing
        id: sign
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -n "${KS_B64:-}" && -n "${KS_PASS:-}" && -n "${KEY_ALIAS:-}" && -n "${KEY_PASS:-}" ]]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/flow-release.jks"
            {
              echo "FLOW_KEYSTORE_PATH=$RUNNER_TEMP/flow-release.jks"
              echo "FLOW_KEYSTORE_PASSWORD=$KS_PASS"
              echo "FLOW_KEY_ALIAS=$KEY_ALIAS"
              echo "FLOW_KEY_PASSWORD=$KEY_PASS"
            } >> "$GITHUB_ENV"
            echo "mode=release" >> "$GITHUB_OUTPUT"
          else
            echo "mode=test" >> "$GITHUB_OUTPUT"
            echo "::notice::Keystore تنظیم نشده؛ APK با کلید debug (فقط برای تست) امضا می‌شود."
          fi

      - name: Build release APK
        run: >
          ./gradlew assembleRelease --stacktrace
          -PversionName=${{ steps.ver.outputs.name }}
          -PversionCode=${{ steps.ver.outputs.code }}

      - name: Name and verify APK
        id: apk
        run: |
          set -euo pipefail
          SRC="$(ls app/build/outputs/apk/release/*.apk | head -n 1)"
          SUFFIX=""
          if [[ "${{ steps.sign.outputs.mode }}" != "release" ]]; then SUFFIX="-testsigned"; fi
          OUT="MatFocus-${{ steps.ver.outputs.name }}-${{ steps.ver.outputs.code }}${SUFFIX}.apk"
          mkdir -p dist
          cp "$SRC" "dist/$OUT"
          APKSIGNER="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose --print-certs "dist/$OUT" | tee dist/signature.txt
          echo "file=dist/$OUT" >> "$GITHUB_OUTPUT"
          {
            echo "### MatFocus ${{ steps.ver.outputs.name }} (${{ steps.ver.outputs.code }})"
            echo "- فایل: \`$OUT\` ($(du -h "dist/$OUT" | cut -f1))"
            if [[ "$SUFFIX" == "" ]]; then
              echo "- امضا: Keystore نسخه‌ی انتشار (Secrets)"
            else
              echo "- امضا: کلید debug؛ قابل نصب برای تست، **نه** برای انتشار در فروشگاه. برای امضای واقعی Secrets زیر را تنظیم کن: ANDROID_KEYSTORE_BASE64، ANDROID_KEYSTORE_PASSWORD، ANDROID_KEY_ALIAS، ANDROID_KEY_PASSWORD"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MatFocus-apk-${{ steps.ver.outputs.name }}-${{ steps.ver.outputs.code }}
          path: |
            ${{ steps.apk.outputs.file }}
            dist/signature.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests
          if-no-files-found: ignore

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') && steps.sign.outputs.mode == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.file }}
          generate_release_notes: true
          prerelease: ${{ steps.sign.outputs.mode != 'release' }}

      - name: Publish update manifest
        if: startsWith(github.ref, 'refs/tags/v') && steps.sign.outputs.mode == 'release'
        uses: actions/github-script@v7
        env:
          APK_FILE: ${{ steps.apk.outputs.file }}
          VERSION_NAME: ${{ steps.ver.outputs.name }}
          VERSION_CODE: ${{ steps.ver.outputs.code }}
        with:
          script: |
            const fs = require('fs');
            const crypto = require('crypto');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const tag = context.ref.replace('refs/tags/', '');
            const release = (await github.rest.repos.getReleaseByTag({ owner, repo, tag })).data;
            const assetName = require('path').basename(process.env.APK_FILE);
            const asset = release.assets.find(item => item.name === assetName);
            if (!asset) throw new Error('Release APK asset not found: ' + assetName);
            const apk = fs.readFileSync(process.env.APK_FILE);
            const sha256 = crypto.createHash('sha256').update(apk).digest('hex');
            const changelog = (release.body || '').split(/\\r?\\n/)
              .map(line => line.replace(/^\\s*[-*]\\s*/, '').trim())
              .filter(Boolean);
            const manifest = {
              schemaVersion: 1,
              versionName: process.env.VERSION_NAME,
              versionCode: Number(process.env.VERSION_CODE),
              releaseDate: release.published_at || new Date().toISOString(),
              changelog,
              downloadUrl: asset.browser_download_url,
              fileSize: apk.length,
              sha256,
              minimumSupportedVersion: 0,
              mandatory: false,
              updateAvailable: true,
              applicationId: 'com.flow.focus'
            };
            const path = 'updates/latest.json';
            let sha;
            try {
              const current = await github.rest.repos.getContent({ owner, repo, path, ref: 'main' });
              sha = current.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner, repo, path, branch: 'main',
              message: 'Publish MatFocus ' + process.env.VERSION_NAME + ' update manifest',
              content: Buffer.from(JSON.stringify(manifest, null, 2) + '\\n').toString('base64'),
              ...(sha ? { sha } : {})
            });
            core.notice('Update manifest published for MatFocus ' + process.env.VERSION_NAME);
