name: Windows Desktop

concurrency:
  group: windows-desktop-${{ github.sha }}
  cancel-in-progress: true

on:
  push:
    branches: [main, feature/windows-desktop]
    paths:
      - "desktopApp/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - "gradlew*"
      - ".github/workflows/windows-desktop.yml"
  pull_request:
    paths:
      - "desktopApp/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - "gradlew*"
      - ".github/workflows/windows-desktop.yml"
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Configure Gradle cache
        uses: gradle/actions/setup-gradle@v4
      - name: Compile desktop application
        run: .\gradlew.bat :desktopApp:compileKotlin --stacktrace
      - name: Run desktop domain tests
        run: .\gradlew.bat :desktopApp:test --stacktrace
      - name: Package Windows MSI
        run: .\gradlew.bat :desktopApp:packageMsi
      - name: Install and smoke-test Windows MSI
        shell: pwsh
        run: |
          $msi = Get-ChildItem "desktopApp/build/compose/binaries/main/msi" -Filter "*.msi" | Select-Object -First 1
          if (-not $msi) { throw "MSI output was not found." }

          $install = Start-Process -FilePath "msiexec.exe" -ArgumentList @("/i", $msi.FullName, "/qn", "/norestart") -Wait -PassThru
          if ($install.ExitCode -notin @(0, 3010)) { throw "MSI installation failed with exit code $($install.ExitCode)." }

          $exe = Get-ChildItem -Path @("$env:ProgramFiles", "$env:LOCALAPPDATA\Programs") -Filter "MedFlow.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { throw "Installed MedFlow.exe was not found." }

          $app = Start-Process -FilePath $exe.FullName -PassThru
          Start-Sleep -Seconds 8
          $app.Refresh()
          if ($app.HasExited) { throw "MedFlow exited during the Windows startup smoke test." }
          Stop-Process -Id $app.Id -Force

          $uninstall = Start-Process -FilePath "msiexec.exe" -ArgumentList @("/x", $msi.FullName, "/qn", "/norestart") -Wait -PassThru
          if ($uninstall.ExitCode -notin @(0, 3010)) { throw "MSI uninstall failed with exit code $($uninstall.ExitCode)." }
      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: MedFlow-Windows-MSI
          path: desktopApp/build/compose/binaries/main/msi/*.msi
          if-no-files-found: error
