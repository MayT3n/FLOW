name: Windows Desktop

on:
  push:
    branches: [main, feature/windows-desktop]
    paths:
      - "desktopApp/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - "gradlew*"
      - ".github/workflows/windows-desktop.yml"
  pull_request:
    paths:
      - "desktopApp/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - "gradlew*"
      - ".github/workflows/windows-desktop.yml"
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Validate desktop compilation
        run: .\gradlew.bat :desktopApp:compileKotlin
      - name: Package Windows MSI
        run: .\gradlew.bat :desktopApp:packageMsi
      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: MedFlow-Windows-MSI
          path: desktopApp/build/compose/binaries/main/msi/*.msi
          if-no-files-found: error
